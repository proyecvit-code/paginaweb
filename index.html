<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝓐𝓱𝓜𝔂𝓗𝓪𝓬𝓴</title>

    <link rel="stylesheet" href="style.css">
    <!-- Icono de la pestaña -->
    <link rel="icon" href="assets/favicon.png" type="image/png">

    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- =========================
         FONDO DE VIDEO
    ========================== -->
    <video id="backgroundVideo" autoplay muted playsinline></video>
    <div class="video-overlay"></div>

    <!-- =========================
         BOTÓN DE SONIDO / VOLUMEN
    ========================== -->
    <div class="sound-control">
        <button id="soundButton" class="corner-button sound-button">
            <i class="fa-solid fa-volume-high"></i>
        </button>
        <div id="volumePanel" class="volume-panel">
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">
        </div>
    </div>

    <!-- =========================
         PANTALLA INICIAL (CLICK TO ENTER)
    ========================== -->
    <div id="startScreen" class="start-screen">
        <div id="enterButton" class="click-to-enter">
            𝒄𝒍𝒊𝒄𝒌 𝒕𝒐 𝒆𝒏𝒕𝒆𝒓...
        </div>
    </div>

    <!-- =========================
         CONTENIDO PRINCIPAL (FLOTANTE SIN TARJETA)
    ========================== -->
    <main class="profile-container">
        <div class="profile-card">

            <!-- Avatar -->
            <div class="avatar-container">
                <img src="assets/avatar.png" id="mainAvatar" alt="Avatar" class="avatar">
            </div>

            <!-- Nombre -->
            <h1 class="glitch" data-text="𝓐𝓱𝓜𝔂𝓗𝓪𝓬𝓴">𝓐𝓱𝓜𝔂𝓗𝓪𝓬𝓴</h1>

            <!-- Descripción -->
            <p class="description">
                𝐸𝑡ℎ𝑖𝑐𝑎𝑙 𝐻𝑎𝑐𝑘𝑒𝑟 | 𝑃𝑦𝑡ℎ𝑜𝑛 | 𝐵𝑢𝑔 𝐻𝑢𝑛𝑡𝑒𝑟
            </p>

            <!-- Ubicación -->
            <div class="location">
                <i class="fa-solid fa-location-dot"></i>
                <span>𝙁𝙪𝙘𝙠 𝙮𝙤𝙪 𝙗𝙞𝙩𝙘𝙝</span>
            </div>

            <!-- Discord Card -->
            <div class="discord-card">
                <div class="discord-avatar-wrap">
                    <img id="discordAvatar" src="assets/avatar.png" alt="Discord avatar">
                    <div id="discordStatusDot" class="discord-status offline"></div>
                </div>
                <div class="discord-info">
                    <strong id="discordUsername">mrahmyhack</strong>
                    <span id="discordActivity">loading...</span>
                </div>
            </div>

            <!-- Redes Sociales -->
            <div class="socials">
                <a href="https://github.com/AhMyHack" target="_blank" class="social" title="GitHub">
                    <i class="fa-brands fa-github"></i>
                </a>
                <a href="https://youtube.com" target="_blank" class="social" title="YouTube">
                    <i class="fa-brands fa-youtube"></i>
                </a>
                <a href="www.tiktok.com/@ahmyhack" target="_blank" class="social" title="TikTok">
                    <i class="fa-brands fa-tiktok"></i>
                </a>
                <a href="https://t.me/AhMyHack" target="_blank" class="social" title="Telegram">
                    <i class="fa-brands fa-telegram"></i>
                </a>
                <a href="https://onlyfans.com/MiaKhalifa" target="_blank" class="social of-social" title="OnlyFans">
                    <i class="fa-solid fa-fire"></i>
                </a>
            </div>

            <!-- Contador de Visitas -->
            <div class="views-counter">
                <i class="fa-solid fa-eye"></i>
                <span id="views">0</span>
            </div>

            <!-- Reproductor de Música Flotante -->
            <div class="music-player-floating">
                <img id="musicCover" src="assets/avatar.png" class="music-cover">

                <div class="music-content">
                    <div class="music-info-text">
                        <span class="music-title" id="musicTitle">Moonlight</span> - 
                        <span class="music-artist" id="musicArtist">XXXTentacion</span>
                    </div>

                    <div class="music-controls">
                        <span id="currentTime">0:00</span>
                        <input type="range" id="progressBar" min="0" max="100" value="0">
                        <span id="duration">0:00</span>
                    </div>
                </div>

                <div class="player-buttons">
                    <button id="previousButton"><i class="fa-solid fa-backward-step"></i></button>
                    <button id="playButton"><i class="fa-solid fa-play"></i></button>
                    <button id="nextButton"><i class="fa-solid fa-forward-step"></i></button>
                </div>
            </div>

        </div>
    </main>

    <!-- Elemento Audio -->
    <audio id="audioPlayer"></audio>

    <script src="script.js"></script>
</body>

</html>
